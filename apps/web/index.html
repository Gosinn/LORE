<!doctype html>
<html lang="en" data-theme="lore" data-world="black-star-sky" data-daylight="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030409" />
    <meta name="color-scheme" content="dark" />
    <!-- Filled in by the server when it packages this app as an Android live update. -->
    <meta name="lore-api-base" content="" />
    <meta name="description" content="LORE: Life Of Regular Epics. No scrolling. Only rolling. Plan experiences together and keep the stories." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>LORE</title>
    <script>
      // The world this device wears, before the first paint (no flash). src/lib/theme.ts works it out and leaves it
      // in 'lore.boot' ({ when, night: [world, bar], day: [world, bar] }), so this script never lists the worlds:
      // a new world needs nothing here. A test (vite/test/theme.test.ts) checks it wears what theme.ts wears.
      (function () {
        var DEFAULT = ['black-star-sky', '#030409'];
        var night = DEFAULT;
        var day = DEFAULT;
        var when = 'night';
        var half = 'night';
        var look = null;
        var sun = null;
        var auto = null;
        var oldWorld = null;
        var oldWhen = null;
        var signedIn = null;
        var json = function (key) {
          try {
            return JSON.parse(localStorage.getItem(key) || 'null');
          } catch (e) {
            return null;
          }
        };
        try {
          auto = localStorage.getItem('lore.auto');
          oldWorld = localStorage.getItem('lore.world');
          oldWhen = localStorage.getItem('lore.daylight');
          signedIn = localStorage.getItem('lore.in');
        } catch (e) {
          // No storage: the defaults.
        }
        look = json('lore.boot');
        // The sun's answer when it was last worked out, and the next sunrises and sunsets from then.
        sun = json('lore.sunNow');
        var slot = function (s) {
          return s && typeof s === 'object' && typeof s[0] === 'string' && typeof s[1] === 'string' ? s : null;
        };
        if (look && slot(look.night) && slot(look.day)) {
          night = look.night;
          day = look.day;
          when = look.when;
        } else if (auto === null) {
          // The first start after the update of 2026-11-19, before theme.ts has run: the choices as they were kept
          // then (lore.world the night world, lore.daylight when it's day), read as theme.ts's loadChoices reads
          // them. These are the worlds there were; never add to this list.
          var OLD = {
            'black-star-sky': '#030409',
            'night-map': '#241b14',
            'midnight-vellum': '#1f1a2c',
            scroll: '#2a1708',
            'treasure-map': '#14201e',
            'mountain-range': '#060a18',
            'northern-lights': '#03060e',
          };
          if (oldWorld && Object.prototype.hasOwnProperty.call(OLD, oldWorld)) night = [oldWorld, OLD[oldWorld]];
          day = ['green-hills', '#fbf3dc'];
          when = oldWhen === 'phone' || oldWhen === 'sun' || oldWhen === 'day' ? oldWhen : 'night';
        }
        if (when === 'sun') {
          var now = Date.now();
          if (sun && sun.until > now && sun.turns && sun.turns.length !== undefined) {
            var passed = 0;
            for (var i = 0; i < sun.turns.length; i++) if (sun.turns[i] <= now) passed++;
            var isDay = passed % 2 === 1 ? !sun.day : !!sun.day;
            half = isDay ? 'day' : 'night';
          } else when = 'phone';
        }
        if (when === 'day') half = 'day';
        if (when === 'phone') {
          try {
            half = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
          } catch (e) {
            // No answer from the phone: night.
          }
        }
        var world = half === 'day' ? day : night;
        // Welcome and "Where do you stand?" wear the default world, by night; so does a start with no one signed in
        // on this device (a new install, or after signing out: it is on its way to Welcome).
        if (signedIn !== '1' || /^\/welcome(\/|$)/.test(location.pathname)) {
          world = DEFAULT;
          half = 'night';
        }
        var root = document.documentElement;
        root.setAttribute('data-world', world[0]);
        root.setAttribute('data-daylight', half);
        var bar = document.querySelector('meta[name="theme-color"]');
        if (bar) bar.setAttribute('content', world[1]);
      })();
    </script>
  </head>
  <body>
    <div class="world" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
